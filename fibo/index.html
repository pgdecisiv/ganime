<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#292c2a" />
    <meta name="description" content="Ganime’s Tower Corporation — Level 03." />
    <title>Ganime’s Tower — Level 03</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/welcome.css" />
    <link rel="stylesheet" href="/screen.css" />
    <link rel="stylesheet" href="/durin.css" />
    <script src="/durin.js" defer></script>
      <link rel="stylesheet" href="/retro.css" />
      <script src="/pedro.js" defer></script>
  </head>
  <body>
    <header class="topbar durin-topbar">
      <span class="level-indicator">LEVEL 03</span>
    </header>
    <main class="durin-main">
      <p class="durin-legend">Speak, Friend</p>
      <figure class="durin-figure">
        <img src="/assets/durin-door.svg" alt="Durin’s Door, carved into dark stone beneath a crescent moon and star." />
      </figure>
      <form class="durin-form" id="password-form" novalidate>
        <label class="visually-hidden" for="password-input">Password</label>
        <input id="password-input" name="password" type="text" autocomplete="off" spellcheck="false" aria-label="Password" />
        <button type="submit">SUBMIT</button>
        <span class="visually-hidden" id="door-feedback" role="status" aria-live="polite"></span>
      </form>
    </main>
  </body>
</html>
