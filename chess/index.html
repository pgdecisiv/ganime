<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Ganime’s Tower Corporation — Level 08 equipment issue." />
    <title>Ganime’s Tower — Level 08</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ganime’s Tower home"><span class="brand-mark" aria-hidden="true"><span></span></span><span>GANIME’S TOWER</span></a>
      <span class="level-indicator">LEVEL 08 <span>// FIELD EQUIPMENT</span></span>
      <div class="topbar-meta"><span class="status-dot"></span><span>PERSONNEL // ISSUE DESK</span></div>
    </header>
    <main class="chess-main">
      <section class="chess-panel" aria-labelledby="chess-title">
        <p class="eyebrow"><span class="eyebrow-line"></span> EMPLOYEE ORIENTATION / EQUIPMENT ISSUE</p>
        <h1 id="chess-title">It's dangerous to go alone, take this:</h1>
        <button class="knight-pickup" id="knight-pickup" type="button" aria-label="Collect pixel-art chess knight">
          <img class="knight-art" src="/assets/knight-transparent.png" alt="" />
          <span class="pickup-prompt" id="pickup-prompt">CLICK TO COLLECT</span>
          <span class="pickup-stamp" aria-hidden="true">ISSUED<br />01 / 01</span>
        </button>
        <div class="chess-unlock" id="chess-unlock" hidden>
          <p>You'll thank me later bucko, things are about to get harder</p>
          <a class="chess-next" href="/seriously-what-is-that">NEXT LEVEL <span>→</span></a>
        </div>
      </section>
    </main>
    <script src="/inventory.js?v=memory-inventory-4" defer></script>
    <script src="/chess/chess.js?v=memory-inventory-1" defer></script>
