<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090611" />
    <meta name="description" content="Ganime’s Tower Corporation — Level 12 movie night." />
    <title>Ganime’s Tower — Level 12</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/welcome.css" />
    <link rel="stylesheet" href="/screen.css" />
    <link rel="stylesheet" href="/inventory.css" />
    <link rel="stylesheet" href="/movienight/level.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ganime’s Tower home"><span class="brand-mark" aria-hidden="true"><span></span></span><span>GANIME’S TOWER</span></a>
      <span class="level-indicator">LEVEL 12 <span>// SOCIAL COHESION</span></span>
      <div class="topbar-meta"><span class="status-dot"></span><span>PERSONNEL // AFTER-HOURS REVIEW</span></div>
    </header>
    <main class="movie-main">
      <section class="movie-scene" aria-labelledby="movie-title">
        <p class="eyebrow"><span class="eyebrow-line"></span> EMPLOYEE BENEFITS / GROUP ACTIVITY</p>
        <h1 id="movie-title">Movie night with the guys</h1>
        <p class="movie-stage-count" id="movie-stage-count">SCENE 01 / 05</p>
        <figure class="movie-portrait movie-drop-target" data-accept-item="pixel-knight" aria-label="Character portrait">
          <img id="movie-face" class="movie-drop-target" src="/assets/faces/t800.png" alt="Pixel-art portrait of a cyborg" data-accept-item="pixel-knight" />
        </figure>
        <div class="movie-dialog movie-drop-target" id="movie-dialog" data-accept-item="pixel-knight" aria-live="polite"></div>
        <form class="movie-answer-form" id="movie-answer-form">
          <label class="visually-hidden" for="movie-answer">Your response</label>
          <input id="movie-answer" class="movie-drop-target" type="text" autocomplete="off" placeholder="TYPE YOUR RESPONSE" data-accept-item="pixel-knight" />
          <button type="submit"><span>RESPOND</span><span aria-hidden="true">↗</span></button>
        </form>
        <p class="movie-feedback" id="movie-feedback" role="status" aria-live="polite"></p>
        <a class="movie-next" id="movie-next" href="/zodiac" hidden>NEXT LEVEL <span>→</span></a>
      </section>
      <aside class="movie-pedro" aria-label="Pedro, tower commentator">
        <div class="commentator-avatar" aria-hidden="true">P<span>•</span></div>
        <div><strong>PEDRO <small>// TOWER COMMENTARY</small></strong><p id="movie-pedro-line">Company policy encourages bonding. Company policy has never met these people.</p></div>
      </aside>
    </main>
    <script src="/inventory.js?v=memory-inventory-4" defer></script>
    <script src="/movienight/level.js?v=answer-normalization-1" defer></script>
  </body>
</html>
